name: HiAnime v5.0 Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Syntax Validation
      run: |
        node -c server.js
        node -c public/app.js
        node -c data/anime-data.js

    - name: Run Automated Enterprise Verification Suite
      run: |
        npm test
